configuration:
  storage_dir:
    name: Where to keep files
    description: Folder for photos, videos and files (under /share or /media, e.g. an external drive mounted in /media). The database stays with the add-on.
  local_urls:
    name: Home addresses
    description: How phones reach the server at home, e.g. http://192.168.1.10:8080. Empty means the host's addresses are used.
  relay_url:
    name: Relay address
    description: Access from outside without a public IP, e.g. wss://r.ll.kg. Ask the relay operator for a tunnel.
  relay_token:
    name: Relay token
    description: The tunnel's token from the relay operator.
  allow_signup:
    name: Open registration
    description: Anyone who can reach the server may create an account. The first user can always register and becomes the admin.
  trash_days:
    name: Days in trash
    description: How long deleted files are kept before they are removed for good.
  log_level:
    name: Log level
network:
  8080/tcp: Web app and the phone app (HTTP)
