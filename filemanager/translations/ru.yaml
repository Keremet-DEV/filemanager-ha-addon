configuration:
  storage_dir:
    name: Где хранить файлы
    description: Папка для фото, видео и файлов (в /share или /media, например внешний диск в /media). База остаётся в дополнении.
  local_urls:
    name: Домашние адреса
    description: По каким адресам телефон находит сервер дома, например http://192.168.1.10:8080. Пусто — адреса хоста.
  relay_url:
    name: Адрес relay
    description: Доступ снаружи без белого IP, например wss://r.ll.kg. Туннель выдаёт владелец relay.
  relay_token:
    name: Токен relay
    description: Токен туннеля от владельца relay.
  allow_signup:
    name: Открытая регистрация
    description: Аккаунт может создать любой, кто видит сервер. Первый пользователь регистрируется всегда и становится админом.
  trash_days:
    name: Дней в корзине
    description: Сколько хранить удалённые файлы, прежде чем удалить навсегда.
  log_level:
    name: Уровень логов
network:
  8080/tcp: Веб-приложение и приложение на телефоне (HTTP)
