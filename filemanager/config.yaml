name: Sandyk
version: "0.1.0"
slug: filemanager
description: Photo, video and file backup from phones, duplicate finder, space on the phone freed
url: https://github.com/Keremet-DEV/filemanager-ha-addon
arch:
  - aarch64
  - amd64
startup: services
hassio_api: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Web app and the phone app (HTTP)
webui: http://[HOST]:[PORT:8080]/
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
backup_exclude:
  - "*/blobs/*"
options:
  storage_dir: /share/filemanager
  local_urls: []
  allow_signup: false
  trash_days: 30
  log_level: info
schema:
  storage_dir: match(^/(share|media|data)(/.*)?$)
  local_urls:
    - url
  relay_url: url?
  relay_token: password?
  allow_signup: bool
  trash_days: int(1,)
  log_level: list(debug|info|warn|error)
